version: 2

updates:
  # A bump that raises the go directive above 1.20 fails CI: the library must keep building on Go 1.20
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: gomod
    directory: /cmd/keychainbreaker
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The release workflow moves the CLI to each new library version
      - dependency-name: github.com/moond4rk/keychainbreaker
    groups:
      cli:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
