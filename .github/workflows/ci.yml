name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: library
            directory: .
          - module: cli
            directory: cmd/keychainbreaker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache-dependency-path: ${{ matrix.directory }}/go.sum

      - name: Use the library from this commit
        if: matrix.module == 'cli'
        run: go work init . ./cmd/keychainbreaker

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: ${{ matrix.directory }}

  library:
    name: Library (Go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.20", stable]
    env:
      GOWORK: "off"
      RACE: ${{ matrix.os != 'windows-latest' && '-race' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}

      # Consumers such as HackBrowserData build the library with Go 1.20
      - name: Keep the library on go 1.20
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.20'
        run: |
          if ! grep -qx 'go 1.20' go.mod; then
            echo "::error file=go.mod::the library must declare 'go 1.20'"
            exit 1
          fi
          if grep -q '^toolchain' go.mod; then
            echo "::error file=go.mod::the library must not pin a toolchain"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ${RACE:+"$RACE"} -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  cli:
    name: CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RACE: ${{ matrix.os != 'windows-latest' && '-race' || '' }}
    defaults:
      run:
        working-directory: cmd/keychainbreaker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache-dependency-path: cmd/keychainbreaker/go.sum

      - name: Check go.mod and go.sum are tidy
        if: runner.os == 'Linux'
        env:
          GOWORK: "off"
        run: go mod tidy -diff

      # The CLI must build against the library in the same commit, not only the published one it pins
      - name: Use the library from this commit
        working-directory: .
        run: go work init . ./cmd/keychainbreaker

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ${RACE:+"$RACE"} ./...

  vulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache-dependency-path: cmd/keychainbreaker/go.sum

      - name: Use the library from this commit
        run: go work init . ./cmd/keychainbreaker

      - name: Run govulncheck on the CLI and the library code it reaches
        working-directory: cmd/keychainbreaker
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  typos:
    name: Spelling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
        with:
          config: ./.typos.toml

  release-config:
    name: Release config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: check

  workflows:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: 1.33.1
          advanced-security: false

  gate:
    needs: [lint, library, cli, vulncheck, typos, release-config, workflows]
    # always(): a skipped job reports success to a ruleset, so this one must run even after a failure or a cancel
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check has passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
