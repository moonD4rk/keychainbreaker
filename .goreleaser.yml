version: 2
project_name: keychainbreaker

builds:
  - id: keychainbreaker
    dir: cmd/keychainbreaker
    binary: keychainbreaker
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildDate={{.Date}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^.*?chore\(release\):'
      - "^.*?chore: update CLI dependency"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: moonD4rk
    name: keychainbreaker
  draft: false
  prerelease: auto

homebrew_casks:
  - name: keychainbreaker
    binaries:
      - keychainbreaker
    homepage: "https://github.com/moonD4rk/keychainbreaker"
    description: "Extract credentials from macOS Keychain files"
    skip_upload: auto
    repository:
      owner: moonD4rk
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: "moond4rk-ci[bot]"
      email: "299850723+moond4rk-ci[bot]@users.noreply.github.com"
    commit_msg_template: "brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    hooks:
      post:
        # The binary is not signed or notarized, so Gatekeeper would refuse to run it
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/keychainbreaker"]
          end
